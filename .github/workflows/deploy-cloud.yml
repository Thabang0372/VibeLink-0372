name: Deploy Cloud Code
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.PARSE_APP_ID }}" ]; then
            echo "::error::Missing PARSE_APP_ID secret"
            exit 1
          fi
          if [ -z "${{ secrets.PARSE_MASTER_KEY }}" ]; then
            echo "::error::Missing PARSE_MASTER_KEY secret"
            exit 1
          fi

      - name: Validate main.js exists
        run: |
          if [ ! -f "main.js" ]; then
            echo "::error::main.js not found in repository root"
            exit 1
          fi

      - name: Download Parse CLI binary
        run: |
          if ! curl -fSL -o parse-cli "https://github.com/parse-community/parse-cli/releases/latest/download/parse-cli-linux-x64" 2>/tmp/curl_error; then
            echo "curl failed, trying wget..."
            wget -O parse-cli "https://github.com/parse-community/parse-cli/releases/latest/download/parse-cli-linux-x64"
          fi
          chmod +x parse-cli
          ./parse-cli --version

      - name: Configure Parse CLI
        run: |
          ./parse-cli configure --appId "${{ secrets.PARSE_APP_ID }}" --masterKey "${{ secrets.PARSE_MASTER_KEY }}"

      - name: Deploy Cloud Code
        run: |
          ./parse-cli deploy --cloud "main.js"