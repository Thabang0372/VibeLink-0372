name: Deploy Cloud Code
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm cache clean --force
      - run: npm install -g parse-cli@1.6.0
      - run: parse --version
      - run: parse configure --appId ${{ secrets.PARSE_APP_ID }} --masterKey ${{ secrets.PARSE_MASTER_KEY }}
      - run: parse deploy --cloud "main.js"