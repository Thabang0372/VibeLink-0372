name: Deploy Cloud Code
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Back4App
        run: |
          curl -X POST \
          -H "X-Parse-Application-Id: ${{ secrets.PARSE_APP_ID }}" \
          -H "X-Parse-Master-Key: ${{ secrets.PARSE_MASTER_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"file":"'$(cat main.js | base64)'"}' \
          "https://parseapi.back4app.com/functions/deployCloudCode"
