name: Deploy Cloud Code
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.PARSE_APP_ID }}" ]; then
            echo "::error::Missing PARSE_APP_ID secret"
            exit 1
          fi
          if [ -z "${{ secrets.PARSE_MASTER_KEY }}" ]; then
            echo "::error::Missing PARSE_MASTER_KEY secret"
            exit 1
          fi

      - name: Check main.js exists
        run: |
          if [ ! -f "main.js" ]; then
            echo "::error::main.js not found in repository root"
            exit 1
          fi

      - name: Deploy to Back4App
        run: |
          python3 <<'EOF'
          import base64
          import json
          import os
          import ssl
          import urllib.request

          app_id = os.environ['PARSE_APP_ID']
          master_key = os.environ['PARSE_MASTER_KEY']

          with open('main.js', 'rb') as f:
              file_content = f.read()

          file_base64 = base64.b64encode(file_content).decode('utf-8')
          payload = json.dumps({"file": file_base64}).encode('utf-8')

          req = urllib.request.Request(
              'https://parseapi.back4app.com/parse/cloud_code',
              data=payload,
              method='POST',
              headers={
                  'X-Parse-Application-Id': app_id,
                  'X-Parse-Master-Key': master_key,
                  'Content-Type': 'application/json'
              }
          )

          try:
              with urllib.request.urlopen(req, context=ssl.create_default_context()) as resp:
                  print(f"✅ Deployment successful (HTTP {resp.status})")
                  print(resp.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              print(f"❌ Deployment failed (HTTP {e.code})")
              print(e.read().decode('utf-8'))
              exit(1)
          except Exception as e:
              print(f"❌ Request error: {e}")
              exit(1)
          EOF
        env:
          PARSE_APP_ID: ${{ secrets.PARSE_APP_ID }}
          PARSE_MASTER_KEY: ${{ secrets.PARSE_MASTER_KEY }}