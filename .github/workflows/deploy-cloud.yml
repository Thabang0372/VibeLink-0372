name: Deploy Cloud Code
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Parse CLI
        run: |
          npm cache clean --force
          npm install -g parse-cli@latest --registry=https://registry.npmjs.org
          parse --version
      - name: Configure Back4App
        run: parse configure --appId ${{ secrets.PARSE_APP_ID }} --masterKey ${{ secrets.PARSE_MASTER_KEY }}
      - name: Deploy Cloud Code
        run: parse deploy --cloud "main.js"