name: Deploy Cloud Code
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g parse-cli
      - run: parse configure --appId ${{ secrets.PARSE_APP_ID }} --masterKey ${{ secrets.PARSE_MASTER_KEY }}
      - run: parse deploy --cloud "cloud-main script.js"